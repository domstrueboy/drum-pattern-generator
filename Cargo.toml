[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
missing_docs = "warn"

# A small, fast app (https://tauri.app/concept/size/).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
